name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch: a push that lands while CI is
# still running makes the earlier result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    name: Format and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Tracked files rather than `gofmt -l .`: gofmt walks the filesystem and
      # ignores module boundaries, so on any checkout where `npm ci` has run it
      # would also inspect vendored .go sources under frontend/node_modules.
      - name: gofmt
        run: |
          # -r so an empty list is a no-op rather than gofmt reading stdin.
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            git ls-files '*.go' | xargs -r gofmt -d
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"
            git diff go.mod go.sum
            exit 1
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Runs without TEST_DATABASE_URL, so the integration suite skips. This
      # proves the domain tests genuinely need no database.
      - name: go test
        run: go test -race ./...

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: interbellum
          POSTGRES_PASSWORD: interbellum
          POSTGRES_DB: interbellum_test
        ports:
          - 5432:5432
        # The job must not start querying before initdb has finished.
        options: >-
          --health-cmd "pg_isready -U interbellum -d interbellum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Migrations are applied by the suite itself (TestMain), so this
      # exercises the same migration path the server uses at startup.
      - name: go test with database
        env:
          TEST_DATABASE_URL: postgres://interbellum:interbellum@localhost:5432/interbellum_test?sslmode=disable
        run: go test -race -count=1 ./...

  build:
    name: Build binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: |
          go build -trimpath -o bin/server ./cmd/server
          go build -trimpath -o bin/migrate ./cmd/migrate

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: this job exists to prove the Dockerfile is
      # valid, not to publish an artifact.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: interbellum-investigation-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /bin/sh interbellum-investigation-engine:ci \
            -c 'test -x /app/server && echo "server binary present and executable"'

  web:
    name: Web console (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      # Proves the production build works; the container build runs the same
      # command, so a failure here is a failure of `docker compose up --build`.
      - run: npm run build

  web-docker:
    name: Build web console image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: interbellum-console:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint /bin/sh interbellum-console:ci \
            -c 'test -f /app/server.js && echo "standalone server present"'

  openapi:
    name: Validate OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint api/openapi.yaml
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml
